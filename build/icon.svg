<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1a0d3d"/>
      <stop offset="100%" stop-color="#070716"/>
    </radialGradient>

    <!-- Main symbol gradient (violet → cyan) -->
    <linearGradient id="symGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow bloom filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="saturate" values="3" result="saturated"/>
      <feMerge>
        <feMergeNode in="saturated"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer glow only -->
    <filter id="outerGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="saturate" values="4"/>
    </filter>

    <!-- Rounded square clip -->
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Subtle hex grid texture -->
  <g clip-path="url(#roundedClip)" opacity="0.07">
    <pattern id="hex" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,2 58,17 58,47 30,62 2,47 2,17" fill="none" stroke="#7c3aed" stroke-width="1"/>
    </pattern>
    <rect width="512" height="512" fill="url(#hex)"/>
  </g>

  <!-- Outer bloom glow (behind symbol) -->
  <g filter="url(#outerGlow)">
    <circle cx="256" cy="235" r="90" fill="#7c3aed" opacity="0.35"/>
    <circle cx="256" cy="330" r="40" fill="#06b6d4" opacity="0.3"/>
  </g>

  <!-- Main symbol: G ring + downward arrow, single unified shape -->
  <g filter="url(#glow)" transform="translate(256,252)">

    <!-- G arc — open circle top-right, filled C shape -->
    <path
      d="
        M  50,-40
        A  90 90 0 1 0  90, 40
        L  20, 40
        L  20,  0
        L  90,  0
      "
      fill="none"
      stroke="url(#symGrad)"
      stroke-width="30"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Downward arrow stem emerging from bottom of G -->
    <line x1="0" y1="60" x2="0" y2="130" stroke="url(#symGrad)" stroke-width="28" stroke-linecap="round"/>

    <!-- Arrow head chevron -->
    <polyline
      points="-36,102 0,142 36,102"
      fill="none"
      stroke="url(#symGrad)"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Spark at arrowhead tip -->
    <circle cx="0" cy="148" r="10" fill="#06b6d4" opacity="0.9"/>

  </g>

  <!-- Inner highlight rim (subtle, gives depth) -->
  <rect
    width="512" height="512" rx="112" ry="112"
    fill="none"
    stroke="url(#symGrad)"
    stroke-width="2"
    opacity="0.15"
  />
</svg>
